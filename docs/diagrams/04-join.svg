<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Joining a running cluster</title>
<defs>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
  <marker id="a-repl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  <marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
</defs>
<rect width="900" height="450" fill="#ffffff"/>
<line x1="220" y1="74" x2="220" y2="434" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="150" y="30" width="140" height="44" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="220.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">New child</text>
<line x1="590" y1="74" x2="590" y2="434" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="520" y="30" width="140" height="44" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/><text x="590.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Parent</text>
