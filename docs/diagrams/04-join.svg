<rect x="95.0" y="96" width="250" height="24" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="220" y="113" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">GetSelfAddress() → 10.0.1.7:8081</text>
<line x1="226" y1="160" x2="584" y2="160" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="287.4" y="140" width="235.2" height="19" rx="4" fill="#ffffff"/><text x="405.0" y="153" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /addChild {"childNode":…}</text>
<rect x="495.0" y="178" width="190" height="24" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="590" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">childNodes = append(…)</text>
<line x1="226" y1="230" x2="584" y2="230" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="354.36" y="210" width="101.28" height="19" rx="4" fill="#ffffff"/><text x="405.0" y="223" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GET /display</text>
<line x1="584" y1="264" x2="226" y2="264" stroke="#59636e" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="298.56" y="244" width="212.88" height="19" rx="4" fill="#ffffff"/><text x="405.0" y="257" text-anchor="middle" font-size="12" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">200 {full snapshot as JSON}</text>
<rect x="95.0" y="284" width="250" height="24" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="220" y="301" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">Lock → data = snapshot → Unlock</text>
<rect x="95" y="136" width="250" height="248" fill="#cf222e" opacity="0.07"/>
<line x1="95" y1="136" x2="345" y2="136" stroke="#cf222e" stroke-dasharray="3 3"/>
<line x1="95" y1="384" x2="345" y2="384" stroke="#cf222e" stroke-dasharray="3 3"/>
<line x1="804" y1="330" x2="596" y2="330" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="664.24" y="310" width="71.52" height="19" rx="4" fill="#ffffff"/><text x="700.0" y="323" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PUT /put</text>
<path d="M 584 352 C 460 362, 330 362, 232 356" fill="none" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/>
<rect x="272.64" y="361" width="294.71999999999997" height="19" rx="4" fill="#ffffff"/><text x="420" y="374" text-anchor="middle" font-size="12" fill="#cf222e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /replicate → connection refused ✗</text>
<rect x="75.0" y="396" width="290" height="24" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="220" y="413" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">http.ListenAndServe(…) — now serving</text>
<text x="16" y="250" text-anchor="start" font-size="11" font-weight="600" fill="#cf222e">not</text>
<text x="16" y="264" text-anchor="start" font-size="11" font-weight="600" fill="#cf222e">listening</text>
<text x="16" y="278" text-anchor="start" font-size="11" font-weight="600" fill="#cf222e">yet</text>
</svg>
