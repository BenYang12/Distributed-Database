<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Parent/child architecture</title>
<defs>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
  <marker id="a-repl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  <marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
</defs>
<rect width="960" height="490" fill="#ffffff"/>
<rect x="40" y="80" width="150" height="56" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.6"/><text x="115.0" y="105.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Writer client</text><text x="115.0" y="124.0" text-anchor="middle" font-size="12" fill="#59636e">PUT / DELETE</text>
<rect x="40" y="330" width="150" height="56" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.6"/><text x="115.0" y="355.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Reader clients</text><text x="115.0" y="374.0" text-anchor="middle" font-size="12" fill="#59636e">GET</text>
<rect x="390" y="60" width="220" height="96" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/><text x="500.0" y="105.0" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Parent node</text><text x="500.0" y="124.0" text-anchor="middle" font-size="12" fill="#59636e">source of truth · owns all writes</text>
<text x="500" y="142" text-anchor="middle" font-size="11" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">map[string]string + RWMutex</text>
<rect x="220" y="320" width="160" height="76" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="300.0" y="355.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Child A</text><text x="300.0" y="374.0" text-anchor="middle" font-size="12" fill="#59636e">read-only replica</text>
<rect x="420" y="320" width="160" height="76" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="500.0" y="355.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Child B</text><text x="500.0" y="374.0" text-anchor="middle" font-size="12" fill="#59636e">read-only replica</text>
<rect x="620" y="320" width="160" height="76" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="700.0" y="355.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Child C</text><text x="700.0" y="374.0" text-anchor="middle" font-size="12" fill="#59636e">read-only replica</text>
<line x1="190" y1="108" x2="386" y2="108" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="198.0" y="89" width="180.00000000000003" height="19" rx="4" fill="#ffffff"/><text x="288" y="102" text-anchor="middle" font-size="12" fill="#1f2328">PUT /put · DELETE /delete</text>
<path d="M 500 156 C 500 230, 300 240, 300 316" fill="none" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<path d="M 500 156 C 500 230, 500 240, 500 316" fill="none" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<path d="M 500 156 C 500 230, 700 240, 700 316" fill="none" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<rect x="462.71999999999997" y="221" width="334.56000000000006" height="19" rx="4" fill="#ffffff"/><text x="630" y="234" text-anchor="middle" font-size="12" fill="#bc4c00">POST /replicate — one goroutine per child, async</text>
<path d="M 190 358 L 216 358" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a-read)"/>
<path d="M 190 372 C 260 440, 470 440, 490 400" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a-read)"/>
<path d="M 190 380 C 280 470, 680 470, 695 400" fill="none" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a-read)"/>
<rect x="316.4" y="461" width="247.20000000000002" height="19" rx="4" fill="#ffffff"/><text x="440" y="474" text-anchor="middle" font-size="12" fill="#1a7f37">GET /get?key=… — served by any node</text>
<path d="M 780 318 C 820 220, 760 110, 614 104" fill="none" stroke="#59636e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<rect x="792.96" y="189" width="106.08000000000001" height="19" rx="4" fill="#ffffff"/><text x="846" y="202" text-anchor="middle" font-size="12" fill="#59636e">child forwards</text>
<rect x="799.68" y="207" width="92.64000000000001" height="19" rx="4" fill="#ffffff"/><text x="846" y="220" text-anchor="middle" font-size="12" fill="#59636e">stray writes</text>
<line x1="740" y1="30" x2="770" y2="30" stroke="#1f2328" stroke-width="1.8"/><text x="778" y="34" text-anchor="start" font-size="12" font-weight="400" fill="#1f2328">write</text>
<line x1="740" y1="50" x2="770" y2="50" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5"/><text x="778" y="54" text-anchor="start" font-size="12" font-weight="400" fill="#1f2328">replication</text>
<line x1="850" y1="30" x2="880" y2="30" stroke="#1a7f37" stroke-width="1.8"/><text x="888" y="34" text-anchor="start" font-size="12" font-weight="400" fill="#1f2328">read</text>
<line x1="850" y1="50" x2="880" y2="50" stroke="#59636e" stroke-width="1.8" stroke-dasharray="6 5"/><text x="888" y="54" text-anchor="start" font-size="12" font-weight="400" fill="#1f2328">forward</text>
