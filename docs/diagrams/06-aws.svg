<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AWS EC2 deployment</title>
<defs>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
  <marker id="a-repl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  <marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
</defs>
<rect width="960" height="430" fill="#ffffff"/>
<rect x="20" y="176" width="150" height="70" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.6"/><text x="95.0" y="208.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">My laptop</text><text x="95.0" y="227.0" text-anchor="middle" font-size="12" fill="#59636e">curl / stresstest</text>
<rect x="196" y="12" width="748" height="408" rx="14" fill="#fff8f0" stroke="#ff9900" stroke-width="1.8"/>
<text x="214" y="36" text-anchor="start" font-size="15" font-weight="700" fill="#b35900">AWS</text>
<rect x="222" y="50" width="700" height="354" rx="12" fill="#ffffff" stroke="#cf222e" stroke-dasharray="6 4"/>
<text x="240" y="72" text-anchor="start" font-size="12" font-weight="600" fill="#cf222e">Security group: SSH :22 and TCP :8080–8082 open to my IP only</text>
<rect x="250" y="86" width="650" height="298" rx="10" fill="#fafbfc" stroke="#59636e" stroke-width="1.5"/>
<text x="266" y="108" text-anchor="start" font-size="13" font-weight="600" fill="#1f2328">EC2 t3.micro · Amazon Linux 2023 · Docker</text>
<rect x="300" y="150" width="580" height="196" rx="8" fill="#eef6fd" stroke="#1d63ed" stroke-dasharray="4 3"/>
<text x="314" y="170" text-anchor="start" font-size="11" font-weight="600" fill="#1d63ed">Docker network “distnet” (containers reach each other by name)</text>
<rect x="322" y="184" width="156" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/><text x="400.0" y="216.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Parent</text><text x="400.0" y="235.0" text-anchor="middle" font-size="12" fill="#59636e">container: parent</text>
<rect x="332.62" y="116" width="134.76" height="18" rx="4" fill="#fafbfc"/><text x="400" y="128" text-anchor="middle" font-size="11" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">host :8080 → :8080</text>
<line x1="400" y1="133" x2="400" y2="182" stroke="#59636e" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="512" y="184" width="156" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="590.0" y="216.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Child</text><text x="590.0" y="235.0" text-anchor="middle" font-size="12" fill="#59636e">container: child1</text>
<rect x="522.62" y="116" width="134.76" height="18" rx="4" fill="#fafbfc"/><text x="590" y="128" text-anchor="middle" font-size="11" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">host :8081 → :8080</text>
<line x1="590" y1="133" x2="590" y2="182" stroke="#59636e" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="702" y="184" width="156" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="780.0" y="216.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Child</text><text x="780.0" y="235.0" text-anchor="middle" font-size="12" fill="#59636e">container: child2</text>
<rect x="712.62" y="116" width="134.76" height="18" rx="4" fill="#fafbfc"/><text x="780" y="128" text-anchor="middle" font-size="11" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">host :8082 → :8080</text>
<line x1="780" y1="133" x2="780" y2="182" stroke="#59636e" stroke-width="1.8" marker-end="url(#a-muted)"/>
<line x1="170" y1="211" x2="248" y2="211" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="190.68" y="190" width="36.64" height="18" rx="4" fill="#ffffff"/><text x="209" y="202" text-anchor="middle" font-size="11" fill="#1f2328">HTTP</text>
<text x="209" y="232" text-anchor="middle" font-size="10" font-weight="400" fill="#59636e">public IP</text>
<path d="M 400 254 C 400 286, 590 286, 590 258" fill="none" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<path d="M 400 254 C 400 326, 780 326, 780 258" fill="none" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<rect x="442.32" y="302" width="295.36" height="18" rx="4" fill="#eef6fd"/><text x="590" y="314" text-anchor="middle" font-size="11" fill="#bc4c00">replication by name (child1:8080, child2:8080)</text>
<text x="575" y="370" text-anchor="middle" font-size="11" font-weight="400" fill="#59636e" font-style="italic">All three nodes share one VM: a real cloud deploy, but no cross-machine fault tolerance</text>
</svg>
