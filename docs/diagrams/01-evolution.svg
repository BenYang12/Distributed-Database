<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>From one server to parent/child</title>
<defs>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
  <marker id="a-repl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  <marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
</defs>
<rect width="960" height="330" fill="#ffffff"/>
<rect x="20" y="14" width="280" height="302" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<text x="160" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">① One server</text>
<rect x="340" y="14" width="280" height="302" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<text x="480" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">② Many servers, anyone writes</text>
<rect x="660" y="14" width="280" height="302" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<text x="800" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">③ Parent / child (this project)</text>
<rect x="115" y="70" width="90" height="38" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.6"/><text x="160.0" y="94.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Client</text>
<line x1="160" y1="108" x2="160" y2="162" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="100" y="164" width="120" height="52" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/><text x="160.0" y="195.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Database</text>
<text x="160" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="#59636e">One machine = one point</text>
<text x="160" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#59636e">of failure, and limited RAM/CPU</text>
<rect x="360" y="70" width="90" height="38" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.6"/><text x="405.0" y="94.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Client A</text>
<rect x="510" y="70" width="90" height="38" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.6"/><text x="555.0" y="94.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Client B</text>
<line x1="405" y1="108" x2="405" y2="162" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<line x1="555" y1="108" x2="555" y2="162" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="375.13" y="128" width="59.74" height="18" rx="4" fill="#ffffff"/><text x="405" y="140" text-anchor="middle" font-size="11" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x = "1"</text>
<rect x="525.13" y="128" width="59.74" height="18" rx="4" fill="#ffffff"/><text x="555" y="140" text-anchor="middle" font-size="11" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x = "2"</text>
<rect x="355" y="164" width="100" height="52" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.6"/><text x="405.0" y="195.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">DB 1</text>
<rect x="505" y="164" width="100" height="52" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.6"/><text x="555.0" y="195.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">DB 2</text>
<line x1="457" y1="190" x2="503" y2="190" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)" marker-start="url(#a-bad)"/>
<text x="480" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#cf222e">?</text>
<text x="480" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="#59636e">Conflicting writes: which</text>
<text x="480" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#59636e">value of x is the truth?</text>
<rect x="750" y="64" width="100" height="42" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/><text x="800.0" y="90.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Parent</text>
<line x1="690" y1="85" x2="746" y2="85" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<text x="690" y="76" text-anchor="start" font-size="11" font-weight="400" fill="#59636e">writes</text>
<line x1="800" y1="106" x2="705" y2="162" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<rect x="663" y="164" width="84" height="42" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="705.0" y="190.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Child</text>
<line x1="800" y1="106" x2="800" y2="162" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<rect x="758" y="164" width="84" height="42" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="800.0" y="190.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Child</text>
<line x1="800" y1="106" x2="895" y2="162" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<rect x="853" y="164" width="84" height="42" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="895.0" y="190.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Child</text>
<rect x="766.28" y="140" width="67.44" height="18" rx="4" fill="#ffffff"/><text x="800" y="152" text-anchor="middle" font-size="11" fill="#bc4c00">replicate</text>
<text x="800" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="#59636e">One writer = one truth.</text>
<text x="800" y="267" text-anchor="middle" font-size="12" font-weight="400" fill="#59636e">Reads spread across children.</text>
<text x="800" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#1a7f37">Add children → more read capacity</text>
</svg>
