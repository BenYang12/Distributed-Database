<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Write and delete paths</title>
<defs>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
  <marker id="a-repl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  <marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
</defs>
<rect width="960" height="620" fill="#ffffff"/>
<line x1="110" y1="74" x2="110" y2="604" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="40" y="30" width="140" height="44" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.6"/><text x="110.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Client</text>
<line x1="360" y1="74" x2="360" y2="604" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="290" y="30" width="140" height="44" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="360.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Child A</text>
<line x1="610" y1="74" x2="610" y2="604" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="540" y="30" width="140" height="44" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/><text x="610.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Parent</text>
<line x1="860" y1="74" x2="860" y2="604" stroke="#d1d9e0" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="790" y="30" width="140" height="44" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/><text x="860.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Child B</text>
<line x1="16" y1="100" x2="944" y2="100" stroke="#d1d9e0"/>
<rect x="16" y="88" width="304.8" height="24" rx="5" fill="#1f2328"/>
<text x="24" y="105" text-anchor="start" font-size="12" font-weight="600" fill="#ffffff">WRITE  (client happens to hit a child)</text>
<line x1="116" y1="140" x2="354" y2="140" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="106.24000000000001" y="120" width="257.52" height="19" rx="4" fill="#ffffff"/><text x="235.0" y="133" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /put {"key":"x","value":"1"}</text>
<line x1="366" y1="180" x2="604" y2="180" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="374.84000000000003" y="160" width="220.32" height="19" rx="4" fill="#ffffff"/><text x="485.0" y="173" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /put  + X-Forwarded-For</text>
<rect x="512.5" y="200" width="195" height="24" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="610" y="217" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">Lock → data[x]=1 → Unlock</text>
<line x1="604" y1="252" x2="366" y2="252" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<rect x="378.56" y="232" width="212.88" height="19" rx="4" fill="#ffffff"/><text x="485.0" y="245" text-anchor="middle" font-size="12" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /replicate (goroutine)</text>
<line x1="616" y1="252" x2="854" y2="252" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<rect x="673.2" y="232" width="123.6" height="19" rx="4" fill="#ffffff"/><text x="735.0" y="245" text-anchor="middle" font-size="12" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /replicate</text>
<line x1="604" y1="292" x2="366" y2="292" stroke="#59636e" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="412.04" y="272" width="145.92" height="19" rx="4" fill="#ffffff"/><text x="485.0" y="285" text-anchor="middle" font-size="12" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">200 Stored: x -> 1</text>
<line x1="354" y1="328" x2="116" y2="328" stroke="#59636e" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="180.64" y="308" width="108.72" height="19" rx="4" fill="#ffffff"/><text x="235.0" y="321" text-anchor="middle" font-size="12" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">200 (relayed)</text>
<text x="735" y="280" text-anchor="middle" font-size="11" font-weight="400" fill="#bc4c00" font-style="italic">parent replies without waiting</text>
<text x="735" y="294" text-anchor="middle" font-size="11" font-weight="400" fill="#bc4c00" font-style="italic">for replication to finish</text>
<line x1="16" y1="380" x2="944" y2="380" stroke="#d1d9e0"/>
<rect x="16" y="368" width="312.4" height="24" rx="5" fill="#1f2328"/>
<text x="24" y="385" text-anchor="start" font-size="12" font-weight="600" fill="#ffffff">DELETE  (client happens to hit a child)</text>
<line x1="116" y1="420" x2="354" y2="420" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="154.6" y="400" width="160.8" height="19" rx="4" fill="#ffffff"/><text x="235.0" y="413" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DELETE /delete?key=x</text>
<line x1="354" y1="456" x2="116" y2="456" stroke="#59636e" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="150.88" y="436" width="168.24" height="19" rx="4" fill="#ffffff"/><text x="235.0" y="449" text-anchor="middle" font-size="12" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">307 Redirect → parent</text>
<line x1="116" y1="496" x2="604" y2="496" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="205.2" y="476" width="309.6" height="19" rx="4" fill="#ffffff"/><text x="360.0" y="489" text-anchor="middle" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DELETE /delete?key=x  (follows redirect)</text>
<rect x="547.5" y="516" width="125" height="24" rx="5" fill="#fff8c5" stroke="#d4a72c"/>
<text x="610" y="533" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2328">delete(data, x)</text>
<line x1="604" y1="572" x2="366" y2="572" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<rect x="378.56" y="552" width="212.88" height="19" rx="4" fill="#ffffff"/><text x="485.0" y="565" text-anchor="middle" font-size="12" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DELETE  X-Replication: true</text>
<line x1="616" y1="572" x2="854" y2="572" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-repl)"/>
<rect x="706.68" y="552" width="56.64" height="19" rx="4" fill="#ffffff"/><text x="735.0" y="565" text-anchor="middle" font-size="12" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(same)</text>
<text x="360" y="604" text-anchor="middle" font-size="11" font-weight="400" fill="#bc4c00" font-style="italic">header says “from the parent: apply it, don’t redirect” → no loop</text>
</svg>
